<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HCGA Client Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#990000; --red-dark:#7A0000; --red-bright:#990000;
    --ink:#111111; --panel:#1A1A1A; --panel-2:#242424;
    --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.14);
    --text:#F8FAFC; --text-dim:#A0A0A0; --text-dimmer:#6B6B6B;
    --amber:#F59E0B; --green:#10B981; --green-bg:rgba(16,185,129,0.14);
    --amber-bg:rgba(245,158,11,0.14); --red-bg:rgba(153,0,0,0.14);
    --radius:16px; --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink); color:var(--text); font-family:'Plus Jakarta Sans','Inter',sans-serif; letter-spacing:-0.015em; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; justify-content:center;}
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans','Outfit',sans-serif; font-weight:700; letter-spacing:-0.025em; margin:0;}
  .app-shell{width:100%; max-width:460px; min-height:100vh; background:var(--ink); position:relative; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,0.5);}
  .screen{flex:1; overflow-y:auto; padding-bottom:90px; animation:fadeIn 0.25s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  ::-webkit-scrollbar{width:0;height:0;}
  .topbar{background:linear-gradient(180deg, var(--red-dark), var(--red) 130%); padding:22px 5% 18px; position:sticky; top:0; z-index:5;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between;}
  .brandmark{display:flex; align-items:center; gap:9px;}
  .brandmark svg{width:26px;height:26px;flex-shrink:0;}
  .brandmark .name{font-family:'Outfit'; font-weight:700; font-size:19px; line-height:1;}
  .brandmark .name small{display:block; font-family:'Inter'; font-weight:500; font-size:9px; letter-spacing:1.5px; color:rgba(255,255,255,0.75); margin-top:2px;}
  .status-pill{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.14); padding:6px 11px 6px 8px; border-radius:100px; font-size:12px; font-weight:600;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#10B981;}
  .topbar h1{font-size:26px; color:#fff; margin-top:14px;}
  .topbar .sub{color:rgba(255,255,255,0.8); font-size:13.5px; margin-top:3px;}
  .section-pad{padding:18px 5%;}
  .section-title{font-size:12px; color:var(--text-dim); font-weight:600; margin-bottom:10px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:15px; margin-bottom:12px;}
  .ship-card{cursor:pointer; transition:border-color .15s ease, transform .1s ease;}
  .ship-card:active{transform:scale(0.985);}
  .route-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .route-pts{flex:1; display:flex; flex-direction:column; gap:5px;}
  .route-line{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
  .dot.origin{background:var(--text-dim);}
  .dot.dest{background:var(--red-bright);}
  .load-meta{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{font-size:11.5px; font-weight:600; color:var(--text-dim); background:var(--panel-2); border:1px solid var(--line); padding:4px 9px; border-radius:100px;}
  .load-foot{display:flex; justify-content:space-between; align-items:center; margin-top:11px; padding-top:11px; border-top:1px solid var(--line);}
  .broker{font-size:12.5px; color:var(--text-dim);}
  .broker b{color:var(--text); font-weight:600;}
  .btn{display:flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius:var(--radius-sm); font-family:'Inter'; font-weight:700; font-size:14.5px; padding:13px 18px; cursor:pointer; width:100%; transition:filter .12s ease, transform .08s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--red-bright); color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:#3A3A3A; color:var(--text-dimmer); cursor:not-allowed;}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--line-strong);}
  .btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--line-strong);}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  label.field{display:block; margin-bottom:14px;}
  label.field span{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  label.field input, label.field select, label.field textarea{width:100%; background:var(--panel-2); border:1px solid var(--line-strong); color:var(--text); border-radius:var(--radius-sm); padding:12px 13px; font-size:14.5px; font-family:'Inter'; outline:none;}
  label.field input:focus, label.field select:focus, label.field textarea:focus{border-color:var(--red-bright);}
  label.field input::placeholder, label.field textarea::placeholder{color:var(--text-dimmer);}
  .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; background:rgba(26,26,26,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; z-index:10; padding:8px 6px calc(8px + env(safe-area-inset-bottom, 0px));}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--text-dimmer); font-family:'Inter'; font-size:10.5px; font-weight:600; padding:6px 2px; cursor:pointer; position:relative;}
  .tab svg{width:21px;height:21px;}
  .tab.active{color:#fff;}
  .tab.active svg{color:var(--red-text);}
  .tab-badge{position:absolute; top:2px; right:22%; background:var(--red-bright); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}
  .stat-row{display:flex; gap:10px; margin:0 0 6px;}
  .stat-box{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; text-align:center;}
  .stat-box b{display:block; font-family:'Outfit'; font-size:22px; color:#fff;}
  .stat-box span{font-size:10.5px; color:var(--text-dim); font-weight:600;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:100px;}
  .badge.green{background:var(--green-bg); color:#34D399;}
  .badge.amber{background:var(--amber-bg); color:var(--amber);}
  .badge.red{background:var(--red-bg); color:#F87171;}
  .badge.grey{background:var(--panel-2); color:var(--text-dim);}
  .progress-wrap{background:var(--panel-2); height:8px; border-radius:8px; overflow:hidden; margin:14px 0;}
  .progress-bar{height:100%; background:linear-gradient(90deg, var(--red-dark), var(--red-bright)); border-radius:8px; transition:width .4s ease;}
  .timeline{display:flex; flex-direction:column; gap:0; margin:6px 0 4px;}
  .tl-step{display:flex; gap:12px; position:relative; padding-bottom:22px;}
  .tl-step:last-child{padding-bottom:0;}
  .tl-dot{width:22px; height:22px; border-radius:50%; background:var(--panel-2); border:2px solid var(--line-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; z-index:1;}
  .tl-dot.done{background:var(--green); border-color:var(--green);}
  .tl-dot.current{background:var(--red-bright); border-color:var(--red-bright);}
  .tl-line{position:absolute; left:10px; top:22px; bottom:0; width:2px; background:var(--line-strong);}
  .tl-line.done{background:var(--green);}
  .tl-body b{display:block; font-size:14px;}
  .tl-body span{font-size:12px; color:var(--text-dim);}
  .avatar{width:44px;height:44px;border-radius:50%; background:var(--panel-2); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .chat-row{display:flex; gap:12px; align-items:center; padding:13px 20px; border-bottom:1px solid var(--line); cursor:pointer;}
  .chat-row:active{background:var(--panel);}
  .chat-row-body{flex:1; min-width:0;}
  .chat-row-top{display:flex; justify-content:space-between; font-size:14px; font-weight:600;}
  .chat-row-preview{color:var(--text-dim); font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chat-time{font-size:11px; color:var(--text-dimmer); flex-shrink:0;}
  .thread{display:flex; flex-direction:column; gap:10px; padding:16px 16px 8px;}
  .bubble{max-width:78%; padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.4;}
  .bubble.them{background:var(--panel); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px;}
  .bubble.me{background:var(--red-bright); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
  .bubble-time{font-size:10px; color:var(--text-dimmer); margin-top:3px;}
  .chat-input-bar{position:sticky; bottom:0; display:flex; gap:8px; padding:10px 14px; background:var(--ink); border-top:1px solid var(--line);}
  .chat-input-bar input{flex:1; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:100px; padding:11px 16px; color:var(--text); font-family:'Inter'; font-size:14px; outline:none;}
  .chat-input-bar button{width:42px; height:42px; border-radius:50%; background:var(--red-bright); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .map-frame{margin:0 20px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:#1B2A22; position:relative; height:200px;}
  .map-frame svg{width:100%; height:100%; display:block;}
  .eta-strip{display:flex; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); margin:14px 20px 0; padding:14px 16px;}
  .eta-item{text-align:center; flex:1;}
  .eta-item b{display:block; font-family:'Outfit'; font-size:20px; color:#fff;}
  .eta-item span{font-size:10.5px; color:var(--text-dim); font-weight:600;}
  .eta-divider{width:1px; background:var(--line); margin:2px 6px;}
  .list-row{display:flex; align-items:center; justify-content:space-between; padding:14px 15px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:9px; cursor:pointer;}
  .list-row-left{display:flex; align-items:center; gap:11px;}
  .list-row span.label{font-size:14px; font-weight:600;}
  .list-row span.value{font-size:12.5px; color:var(--text-dim);}
  .chev{color:var(--text-dimmer); flex-shrink:0;}
  .empty{text-align:center; padding:50px 30px; color:var(--text-dim);}
  .empty svg{width:44px;height:44px; color:var(--text-dimmer); margin-bottom:12px;}
  .empty h3{color:var(--text); font-size:17px; margin-bottom:6px;}
  .empty p{font-size:13.5px; line-height:1.5;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:20; display:flex; align-items:flex-end; justify-content:center;}
  .modal-sheet{width:100%; max-width:460px; background:var(--ink); border-radius:20px 20px 0 0; max-height:90vh; overflow-y:auto; animation:slideUp .22s ease; border-top:1px solid var(--line-strong);}
  @keyframes slideUp{ from{transform:translateY(16px); opacity:0.6;} to{transform:translateY(0); opacity:1;} }
  .sheet-handle{width:36px; height:4px; background:var(--line-strong); border-radius:3px; margin:10px auto 4px;}
  .sheet-header{display:flex; justify-content:space-between; align-items:center; padding:10px 18px 0;}
  .sheet-close{background:var(--panel-2); border:none; color:var(--text); width:30px;height:30px;border-radius:50%; cursor:pointer; display:flex;align-items:center;justify-content:center;}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line-strong); color:#fff; padding:11px 18px; border-radius:100px; font-size:13.5px; font-weight:600; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,0.4); display:flex; align-items:center; gap:8px; animation:toastIn .2s ease;}
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
  .onboard{min-height:100vh; display:flex; flex-direction:column; background:radial-gradient(circle at 20% 0%, #2A0A0A 0%, var(--ink) 55%);}
  .onboard-hero{padding:52px 26px 30px; text-align:left;}
  .onboard-hero .brandmark{margin-bottom:38px;}
  .onboard-hero h1{font-size:36px; color:#fff; line-height:1.05;}
  .onboard-hero h1 em{font-style:normal; color:var(--red-text);}
  .onboard-hero p{color:var(--text-dim); font-size:14.5px; margin-top:12px; line-height:1.5; max-width:320px;}
  .onboard-form{background:var(--panel); margin:6px 18px 18px; border-radius:18px; padding:22px; border:1px solid var(--line);}
  .doc-row{display:flex; align-items:center; gap:12px; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:13px 14px; margin-bottom:10px;}
  .doc-icon{width:38px; height:38px; border-radius:10px; background:var(--panel); border:1px solid var(--line-strong); color:var(--text-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .doc-icon svg{width:19px;height:19px;}
  .doc-icon.done{background:var(--green-bg); border-color:var(--green); color:#34D399;}
  .doc-body{flex:1; min-width:0;}
  .doc-label{font-size:14px; font-weight:600;}
  .doc-sub{font-size:12px; color:var(--text-dim); margin-top:1px;}
  .sig-pad-wrap{background:#fff; border-radius:var(--radius-sm); overflow:hidden; touch-action:none;}
  .sig-pad-wrap canvas{width:100%; height:180px; display:block; touch-action:none;}
  .log-line{font-family:'SFMono-Regular',Consolas,monospace; font-size:11px; line-height:1.5; color:var(--text-dim); padding:6px 0; border-bottom:1px solid var(--line); white-space:pre-wrap; word-break:break-word;}
  .log-line:last-child{border-bottom:none;}
  .log-line .ok{color:#34D399;}
  .vet-result{display:flex; flex-direction:column; gap:8px;}
  .vet-row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0;}
  .vet-row span{color:var(--text-dim);}
  @media (prefers-reduced-motion: reduce){ .screen, .modal-sheet, .toast{animation:none;} }

  /* ============================================================
     Capa de marca unificada con la web HCGA (HGCA/src/index.css):
     Outfit + Inter, negro #111, rojo corporativo #990000.
     ============================================================ */
  :root{ --red-text:#E84545; --red-bg:rgba(153,0,0,0.22); --shadow-red:0 4px 14px 0 rgba(153,0,0,0.39); }
  h1,h2,h3,h4,.display{font-family:'Outfit','Inter',system-ui,sans-serif; letter-spacing:-0.02em;}
  ::selection{background:#990000; color:#fff;}
  .hcga-logo{
    display:inline-block; flex-shrink:0; height:28px; aspect-ratio:1024/221;
    background:url(logo-white.svg?v=5) no-repeat left center/contain;
  }
  .brand-tag{
    display:inline-flex; align-items:center; font-family:'Inter',sans-serif; font-size:9px; font-weight:700;
    letter-spacing:1.4px; text-transform:uppercase; color:#fff; line-height:1;
    padding:4px 8px; border-radius:9999px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
  }
  .btn-primary{background:#990000; color:#fff; box-shadow:var(--shadow-red); transition:background-color .15s ease, transform .15s ease, box-shadow .15s ease;}
  .btn-primary:hover{background:#7A0000; filter:none; transform:translateY(-2px); box-shadow:0 6px 20px rgba(153,0,0,0.3);}
  .btn-primary:disabled{box-shadow:none; transform:none;}
  .btn-outline:hover{background:rgba(255,255,255,0.08); border-color:#fff;}
  input:focus, select:focus, textarea:focus{box-shadow:0 0 0 3px rgba(153,0,0,0.18);}


  /* Fondo animado de flota (HGCA/src/index.css · TruckBackground) */
  .truck-bg{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; color:rgba(170,176,186,0.22);}
  .truck-bg__lane{position:absolute; left:50%; width:150vmax; height:110px;}
  .truck-bg__road{position:absolute; left:0; right:0; bottom:4px; border-top:2px dashed rgba(170,176,186,0.1);}
  .truck-bg__truck{position:absolute; left:0; bottom:5px; width:300px; scale:var(--truck-scale,1); animation-name:truck-bg-drive; animation-timing-function:linear; animation-iteration-count:infinite; will-change:translate;}
  .truck-bg__truck--reverse{scale:calc(-1 * var(--truck-scale,1)) var(--truck-scale,1); animation-name:truck-bg-drive-reverse;}
  .truck-bg__truck svg{display:block; width:100%; height:auto; overflow:visible;}
  .truck-bg .tb-body{fill:currentColor; fill-opacity:0.18;}
  .truck-bg .tb-glass{fill:currentColor; fill-opacity:0.5;}
  .truck-bg .tb-dark{fill:currentColor; fill-opacity:0.6;}
  .truck-bg .tb-tire{fill:currentColor; fill-opacity:0.7;}
  .truck-bg__wheel{animation:truck-bg-wheel 0.9s linear infinite;}
  @keyframes truck-bg-drive{ from{translate:-330px 0;} to{translate:calc(150vmax + 20px) 0;} }
  @keyframes truck-bg-drive-reverse{ from{translate:calc(150vmax + 20px) 0;} to{translate:-330px 0;} }
  @keyframes truck-bg-wheel{ to{rotate:360deg;} }
  @media (max-width:768px){ .truck-bg__lane--desktop{display:none;} .truck-bg__truck{width:190px;} }
  @media (prefers-reduced-motion:reduce){ .truck-bg__truck, .truck-bg__wheel{animation-play-state:paused;} }
  /* dejar ver el fondo animado detrás del contenido */

        </div>

        <div class="section-title" style="margin-top:18px;">Cuenta</div>
        <div class="list-row"><div class="list-row-left">${ICONS.user}<span class="label">Datos de la empresa</span></div>${ICONS.chevron}</div>
        <div class="list-row"><div class="list-row-left">${ICONS.invoice}<span class="label">Método de pago</span></div>${ICONS.chevron}</div>
        <div class="list-row" id="btn-logout"><div class="list-row-left">${ICONS.logout}<span class="label">Cerrar sesión</span></div></div>
      </div>`;
  }

  /* ============ CARRIER VETTING TAB ============ */
  function renderVettingTab(){
    const v = state.vetting;
    return `
      <div class="topbar">
        <div class="topbar-row">${brandmark()}<div class="status-pill"><span class="status-dot"></span>FMCSA API</div></div>
        <h1>Verificar transportista</h1>
        <div class="sub">Consulta autoridad MC, seguro y calificación de seguridad antes de asignar una carga</div>
      </div>
      <div class="section-pad">
        <form id="form-vet">
          <label class="field"><span>Número MC del transportista</span><input required name="mc" value="${esc(v.mc)}" placeholder="Ej. 451207"></label>
          <button class="btn btn-primary" type="submit" ${v.loading?'disabled':''}>${v.loading ? 'Consultando FMCSA...' : 'Verificar cumplimiento MC'}</button>
        </form>
        ${v.loading ? `<div class="card" style="text-align:center; color:var(--text-dim); font-size:13px; margin-top:14px;">Consultando autoridad FMCSA y cobertura de seguro…</div>` : ''}
        ${v.result ? renderVetResult(v.result, v.mc) : ''}
        <div class="section-title" style="margin-top:20px;">Prueba con estos MC de ejemplo</div>
        <div class="load-meta"><span class="chip">451207 · apto</span><span class="chip">118845 · revisar</span><span class="chip warn">204477 · no apto</span></div>
      </div>`;
  }
  function renderVetResult(r, mc){
    if(!r.found){
      return `<div class="card" style="margin-top:14px;"><span class="badge grey">Sin registro</span><div style="margin-top:8px; font-size:13px; color:var(--text-dim);">No se encontró el MC-${esc(mc)} en la base de la FMCSA. Verifica el número.</div></div>`;
    }
    const cls = r.verdict==='apto' ? 'green' : (r.verdict==='revisar' ? 'amber' : 'red');
    const label = r.verdict==='apto' ? 'Apto para operar' : (r.verdict==='revisar' ? 'Revisar antes de asignar' : 'No apto — no asignar carga');
    return `
      <div class="card" style="margin-top:14px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div style="font-weight:700; font-size:14.5px;">${esc(r.name)}</div>
          <span class="badge ${cls}">${label}</span>
        </div>
        <div class="vet-result">
          <div class="vet-row"><span>Autoridad FMCSA</span><b>${esc(r.authority)}</b></div>
          <div class="vet-row"><span>Seguro</span><b>${esc(r.insurance)}</b></div>
          <div class="vet-row"><span>Calificación de seguridad</span><b>${esc(r.safety)}</b></div>
        </div>
      </div>`;
  }

  /* ============ TABBAR ============ */
  function renderTabbar(){
    const unread = state.chats.reduce((n,c)=>n+(c.unread||0),0);
    const tabs = [
      {key:'shipments', label:'Envíos', icon:ICONS.ship},
      {key:'request', label:'Solicitar', icon:ICONS.plus},
      {key:'vetting', label:'Verificar', icon:ICONS.shield},
      {key:'chat', label:'Mensajes', icon:ICONS.chat, badge:unread},
      {key:'account', label:'Cuenta', icon:ICONS.user},
    ];
    return `<div class="tabbar">${tabs.map(t=>`
      <button class="tab ${state.activeTab===t.key?'active':''}" data-tab="${t.key}">${t.icon}<span>${t.label}</span>${t.badge?`<span class="tab-badge">${t.badge}</span>`:''}</button>`).join('')}</div>`;
  }

  function render(){
    const app = document.getElementById('app');
    if(!state.account){ app.innerHTML = renderOnboarding(); bindOnboarding(); return; }
    let screenHtml = '';
    if(state.activeTab==='shipments') screenHtml = renderShipmentsTab();
    else if(state.activeTab==='request') screenHtml = renderRequestTab();
    else if(state.activeTab==='vetting') screenHtml = renderVettingTab();
    else if(state.activeTab==='chat') screenHtml = renderChatTab();
    else if(state.activeTab==='account') screenHtml = renderAccountTab();

    let modal = '';
    if(state._openShip){
      const s = state.shipments.find(x=>x.id===state._openShip);
      if(s) modal = renderShipmentModal(s);
    }
    if(state._signing){
      const s = state.shipments.find(x=>x.id===state._signing.shipId);
      const label = state._signing.docKey==='rateConf' ? 'Rate Confirmation' : 'BOL · Bill of Lading';
      modal = renderSignatureModal(state._signing.shipId, state._signing.docKey, label);
    }
    const toast = state.toast? `<div class="toast">${ICONS.check}${esc(state.toast)}</div>` : '';
    app.innerHTML = `<div class="screen">${screenHtml}</div>${renderTabbar()}${modal}${toast}`;
    bindEvents();
  }

  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(el=> el.addEventListener('click', ()=> setState({activeTab: el.getAttribute('data-tab'), openChatId:null})));
    document.querySelectorAll('.ship-card[data-ship]').forEach(el=> el.addEventListener('click', ()=> setState({_openShip: el.getAttribute('data-ship')})));
    const closeModal = document.getElementById('close-modal');
    if(closeModal) closeModal.addEventListener('click', ()=> setState({_openShip:null, _signing:null}));

    const msgDriver = document.getElementById('btn-msg-driver');
    if(msgDriver) msgDriver.addEventListener('click', ()=>{
      const s = state.shipments.find(x=>x.id===state._openShip);
      setState({_openShip:null, activeTab:'chat', openChatId: s?s.chatId:null});
    });
    const podBtn = document.getElementById('btn-pod');
    if(podBtn) podBtn.addEventListener('click', ()=> showToast('Comprobante de entrega descargado'));

    document.querySelectorAll('[data-doc-upload]').forEach(input=>{
      input.addEventListener('change', ()=>{
        if(!input.files || !input.files[0]) return;
        const key = input.getAttribute('data-doc-upload');
        const s = state.shipments.find(x=>x.id===state._openShip);
        s.docs[key].uploaded = true;
        save(); render();
        showToast('Documento subido correctamente');
      });
    });
    document.querySelectorAll('[data-open-sign]').forEach(el=>{
      el.addEventListener('click', ()=> setState({_signing:{shipId:state._openShip, docKey: el.getAttribute('data-open-sign')}}));
    });

    const sigCanvas = document.getElementById('sig-canvas');
    if(sigCanvas){
      const ctx = sigCanvas.getContext('2d');
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#111111';
      let drawing = false, hasDrawn = false;
      function pos(e){
        const r = sigCanvas.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return {x:(p.clientX-r.left) * (sigCanvas.width/r.width), y:(p.clientY-r.top) * (sigCanvas.height/r.height)};
      }
      function start(e){ e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
      function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); hasDrawn = true; }
      function end(){ drawing = false; }
      sigCanvas.addEventListener('mousedown', start); sigCanvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      sigCanvas.addEventListener('touchstart', start, {passive:false}); sigCanvas.addEventListener('touchmove', move, {passive:false});
      sigCanvas.addEventListener('touchend', end);

      const clearBtn = document.getElementById('btn-sig-clear');
      if(clearBtn) clearBtn.addEventListener('click', ()=>{ ctx.clearRect(0,0,sigCanvas.width,sigCanvas.height); hasDrawn = false; });
      const saveBtn = document.getElementById('btn-sig-save');
      if(saveBtn) saveBtn.addEventListener('click', ()=>{
        if(!hasDrawn){ showToast('Dibuja tu firma antes de confirmar'); return; }
        const s = state.shipments.find(x=>x.id===state._signing.shipId);
        const key = state._signing.docKey;
        s.docs[key].signed = true;
        s.docs[key].signedBy = state.account.contact;
        s.docs[key].date = new Date().toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
        setState({_signing:null});
        showToast('Documento firmado digitalmente');
      });
    }

    const vetForm = document.getElementById('form-vet');
    if(vetForm) vetForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(vetForm);
      const mc = (fd.get('mc')||'').trim().replace(/^MC-?/i,'');
      state.vetting.mc = mc; state.vetting.loading = true; state.vetting.result = null;
      pushApiLog('GET', `/v1/fmcsa/authority?mc=${mc}`, '…');
      save(); render();
      setTimeout(()=>{
        const hit = MC_DATABASE[mc];
        state.vetting.loading = false;
        state.vetting.result = hit ? Object.assign({found:true}, hit) : {found:false};
        pushApiLog('GET', `/v1/fmcsa/authority?mc=${mc}`, hit ? '200 OK' : '404 Not Found');
        pushApiLog('GET', `/v1/insurance/verify?mc=${mc}`, hit ? '200 OK' : '404 Not Found');
        save(); render();
      }, 1100);
    });

    const reqForm = document.getElementById('form-request');
    if(reqForm) reqForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(reqForm);
      const id = 'L-'+(1050+state.shipments.length);
      const s = {id, origin:fd.get('origin'), dest:fd.get('dest'), miles: Math.round(40+Math.random()*160),
        rate: Number(fd.get('rate')), equip:fd.get('equip'), weight:fd.get('weight'), pickup:fd.get('pickup'),
        stage:'pending', progress:0, driver:null, chatId:null,
        docs:{rateConf:{uploaded:false, signed:false}, bol:{uploaded:false, signed:false}}};
      state.shipments.unshift(s);
      pushApiLog('POST', '/v1/loads', '201 Created');
      setState({activeTab:'shipments'});
      showToast('Solicitud publicada. Buscando conductor.');
      reqForm.reset();
    });

    document.querySelectorAll('[data-chat]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-chat'); const c = state.chats.find(x=>x.id===id); if(c) c.unread=0;
      setState({openChatId:id});
    }));
    const backChats = document.getElementById('btn-back-chats');
    if(backChats) backChats.addEventListener('click', ()=> setState({openChatId:null}));
    const sendBtn = document.getElementById('btn-send-chat');
    const chatInput = document.getElementById('chat-input');
    function sendMessage(){
      if(!chatInput || !chatInput.value.trim()) return;
      const c = state.chats.find(x=>x.id===state.openChatId);
      c.messages.push({from:'me', text:chatInput.value.trim(), time:'Ahora'}); save(); render();
      setTimeout(()=>{
        const c2 = state.chats.find(x=>x.id===state.openChatId);
        if(c2){ c2.messages.push({from:'them', text:AUTO_REPLIES[Math.floor(Math.random()*AUTO_REPLIES.length)], time:'Ahora'}); save(); if(state.openChatId===c2.id) render(); }
      }, 1200);
    }
    if(sendBtn) sendBtn.addEventListener('click', sendMessage);
    if(chatInput) chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });

    const logoutRow = document.getElementById('btn-logout');
    if(logoutRow) logoutRow.addEventListener('click', ()=>{
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state = defaultState(); render();
    });
  }

  render();
})();
</script>
<script>

(function(){

  const tractor =
    '<rect class="tb-body" x="309" y="8" width="4" height="50" rx="1"/>' +

    '<path class="tb-glass" d="M318 28 H333 L343 48 H318 Z"/>' +

    '<line x1="351" y1="50" x2="351" y2="66"/><line x1="389" y1="57" x2="389" y2="74"/>' +
    '<rect class="tb-glass" x="382" y="60" width="6" height="4" rx="1"/>' +
    '<rect class="tb-dark" x="376" y="80" width="20" height="5" rx="1.5"/>' +
    '<path d="M344 46 L348 36 H352 V44"/>' +
    '<rect class="tb-body" x="318" y="70" width="28" height="12" rx="6"/>' +
    '<path class="tb-body" d="M352 84 A15 15 0 0 1 380 84"/>' +
    '<rect class="tb-dark" x="268" y="80" width="46" height="5"/>' +
    wheel(284) + wheel(306) + wheel(366);

  const trailerGear = (floor = 78) =>
    `<rect class="tb-dark" x="16" y="${floor}" width="62" height="6"/>` +
    `<path d="M80 ${floor} V96 H84"/><path d="M214 ${floor} V94 M209 96 H219"/>` +
    wheel(32) + wheel(58);

  const vanTrailer = (ribs) =>
    '<rect class="tb-body" x="2" y="12" width="262" height="66" rx="2"/>' +
    '<line x1="2" y1="18" x2="264" y2="18"/>' +
    (ribs ? Array.from({length:10}, (_, i) => `<line x1="${26 + i * 24}" y1="18" x2="${26 + i * 24}" y2="78"/>`).join('') : '') +
    '<line x1="10" y1="18" x2="10" y2="78"/><line x1="6" y1="26" x2="6" y2="70"/>' +
    '<rect class="tb-glass" x="2" y="70" width="5" height="4"/><line x1="264" y1="72" x2="276" y2="72"/>';

  const TRUCKS = {
    dryVan: vanTrailer(true) + trailerGear() + tractor,
    reefer: vanTrailer(false) +
      '<rect class="tb-body" x="256" y="22" width="12" height="32" rx="2"/>' +
      '<line x1="259" y1="28" x2="265" y2="28"/><line x1="259" y1="33" x2="265" y2="33"/><line x1="259" y1="38" x2="265" y2="38"/>' +
      '<g transform="translate(132 45)"><line x1="-12" y1="0" x2="12" y2="0"/><line x1="-6" y1="-10.4" x2="6" y2="10.4"/><line x1="-6" y1="10.4" x2="6" y2="-10.4"/></g>' +
      trailerGear() + tractor,
    flatbed:
      '<rect class="tb-dark" x="2" y="70" width="264" height="8"/>' +
      '<rect class="tb-body" x="256" y="38" width="8" height="32"/><line x1="260" y1="38" x2="260" y2="70"/>' +
      '<circle class="tb-body" cx="40" cy="52" r="18"/><circle cx="40" cy="52" r="7"/>' +
      '<rect class="tb-body" x="70" y="42" width="100" height="28"/><line x1="70" y1="51" x2="170" y2="51"/><line x1="70" y1="60" x2="170" y2="60"/>' +
      '<rect class="tb-body" x="180" y="36" width="70" height="34"/><path d="M180 36 L250 70 M250 36 L180 70"/>' +
      '<line x1="100" y1="42" x2="100" y2="78"/><line x1="140" y1="42" x2="140" y2="78"/><line x1="215" y1="36" x2="215" y2="78"/>' +
      trailerGear() + tractor,
    uBox:
      '<rect class="tb-dark" x="2" y="70" width="264" height="8"/>' +
      [6, 92, 178].map(x =>
        `<g><rect class="tb-body" x="${x}" y="16" width="80" height="54" rx="4"/><line x1="${x}" y1="24" x2="${x + 80}" y2="24"/>` +
        `<rect x="${x + 24}" y="30" width="32" height="34" rx="1"/><line x1="${x + 40}" y1="30" x2="${x + 40}" y2="64"/></g>`).join('') +
      trailerGear() + tractor,
    boxTruck:
      '<rect class="tb-body" x="60" y="14" width="222" height="66" rx="2"/>' +
      '<line x1="60" y1="20" x2="282" y2="20"/><line x1="68" y1="20" x2="68" y2="80"/><path d="M60 34 H68 M60 48 H68 M60 62 H68"/>' +
      '<rect class="tb-dark" x="54" y="78" width="10" height="6"/><rect class="tb-dark" x="90" y="80" width="200" height="5"/>' +
      '<path class="tb-body" d="M286 84 V34 Q286 26 294 26 H328 Q334 26 337 32 L347 54 L370 57 Q378 58 378 66 V80 Q378 84 374 84 Z"/>' +
      '<path class="tb-glass" d="M300 33 H330 L339 52 H300 Z"/><line x1="294" y1="30" x2="294" y2="80"/><path d="M340 50 L344 42 H348 V48"/>' +
      '<rect class="tb-glass" x="368" y="62" width="6" height="4" rx="1"/><rect class="tb-dark" x="362" y="80" width="20" height="5" rx="1.5"/>' +
      '<path class="tb-body" d="M338 84 A15 15 0 0 1 366 84"/><rect class="tb-body" x="300" y="72" width="24" height="10" rx="5"/>' +
      wheel(118) + wheel(140) + wheel(352),
    cargoVan:
      '<path class="tb-body" d="M150 86 V30 Q150 18 162 18 H320 Q332 18 340 30 L354 54 Q378 58 384 68 V82 Q384 86 380 86 Z"/>' +
      '<path class="tb-glass" d="M324 26 Q330 26 334 32 L348 54 H324 Z"/>' +
      '<line x1="318" y1="24" x2="318" y2="84"/><line x1="262" y1="24" x2="262" y2="84"/><line x1="200" y1="28" x2="318" y2="28"/><line x1="158" y1="24" x2="158" y2="84"/>' +
      '<rect class="tb-glass" x="150" y="40" width="4" height="12"/><rect class="tb-glass" x="374" y="64" width="7" height="4" rx="1"/>' +

      '<path class="tb-body" d="M176 86 A16 16 0 0 1 208 86"/><path class="tb-body" d="M324 86 A16 16 0 0 1 356 86"/>' +
      wheel(192) + wheel(340),
  };

  // Mismos carriles que la web: top (% alto), ángulo, sentido, duración y desfase.
  const LANES = [
    {type:'dryVan',   top:12, angle:0,  dir:1,  duration:38, delay:-4,  scale:1},
    {type:'cargoVan', top:24, angle:-8, dir:-1, duration:30, delay:-18, scale:0.7},
    {type:'reefer',   top:38, angle:0,  dir:-1, duration:44, delay:-10, scale:1.05},
    {type:'flatbed',  top:52, angle:6,  dir:1,  duration:46, delay:-30, scale:0.95},
    {type:'boxTruck', top:66, angle:0,  dir:1,  duration:34, delay:-8,  scale:0.85, desktopOnly:true},
    {type:'uBox',     top:78, angle:-5, dir:-1, duration:50, delay:-22, scale:1},
    {type:'dryVan',   top:90, angle:0,  dir:1,  duration:42, delay:-36, scale:0.85, desktopOnly:true},
    {type:'reefer',   top:45, angle:28, dir:-1, duration:56, delay:-44, scale:0.75, desktopOnly:true},
  ];

  const bg = document.createElement('div');
  bg.className = 'truck-bg';
  bg.setAttribute('aria-hidden', 'true');
  bg.innerHTML = LANES.map(l =>
    `<div class="truck-bg__lane${l.desktopOnly ? ' truck-bg__lane--desktop' : ''}" style="top:${l.top}%;transform:translate(-50%,-50%) rotate(${l.angle}deg)">` +
    `<span class="truck-bg__road"></span>` +
    `<div class="truck-bg__truck${l.dir < 0 ? ' truck-bg__truck--reverse' : ''}" style="animation-duration:${l.duration}s;animation-delay:${l.delay}s;--truck-scale:${l.scale}">` +
    `<svg viewBox="0 0 400 104" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${TRUCKS[l.type]}</svg>` +
    `</div></div>`).join('');
  document.body.prepend(bg);
})();
</script>
