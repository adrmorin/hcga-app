<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>HCGA Trading — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#990000; --red-dark:#7A0000; --red-bright:#DC2626; --red-text:#F87171;
    --ink:#0A0C0F; --panel:rgba(26,26,26,0.30); --panel-2:rgba(36,36,36,0.30);
    --line:rgba(255,255,255,0.16); --line-strong:rgba(255,255,255,0.28);
    --text:#F8FAFC; --text-dim:#A0A0A0; --text-dimmer:#6B6B6B;
    --amber:#F59E0B; --green:#10B981;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; overflow:hidden;}
  h1,h2,h3{font-family:'Outfit',sans-serif; font-weight:700; margin:0;}
  .stage{position:relative; width:100vw; height:100vh; overflow:hidden;}
  .scene{
    position:absolute; inset:0; display:flex; opacity:0; pointer-events:none;
    transition:opacity .5s ease; padding:6vh 7vw; align-items:center;
  }
  .scene.active{opacity:1; pointer-events:auto;}
  .scene-inner{display:flex; align-items:center; gap:60px; width:100%; max-width:1180px; margin:0 auto;}
  .scene.stack .scene-inner{flex-direction:column; text-align:center;}
  .col-text{flex:1; min-width:0;}
  .col-visual{flex:1; display:flex; justify-content:center; min-width:0;}
  .kicker{font-size:12.5px; font-weight:700; letter-spacing:0.5px; color:var(--red-text); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .kicker .dot{width:7px;height:7px;border-radius:50%; background:var(--red-bright);}
  .headline{font-size:clamp(30px,4.4vw,52px); line-height:1.04; color:#fff;}
  .headline em{font-style:normal; color:var(--red-text);}
  .body-text{font-size:16px; color:var(--text-dim); line-height:1.6; margin-top:18px; max-width:460px;}
  .scene.stack .body-text{margin-left:auto; margin-right:auto;}
  .pill-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:22px;}
  .scene.stack .pill-row{justify-content:center;}
  .pill{background:var(--panel); border:1px solid var(--line-strong); color:var(--text); font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:100px;}
  .pill.bad{color:#F87171; border-color:rgba(248,113,113,0.4);}
  .pill.good{color:#34D399; border-color:rgba(52,211,153,0.4);}

  /* phone mock */
  .phone{
    width:270px; height:560px; background:var(--panel); border:8px solid #0A0A0A; border-radius:36px;
    box-shadow:0 30px 70px rgba(0,0,0,0.55); position:relative; overflow:hidden; flex-shrink:0;
  }
  .phone .pbar{background:linear-gradient(180deg, var(--red-dark), var(--red)); padding:16px 16px 12px;}
  .phone .pbar .brand{display:flex; align-items:center; gap:7px; font-family:'Outfit'; font-weight:700; font-size:14px; color:#fff;}
  .phone .pbar h4{color:#fff; font-size:19px; margin-top:10px;}
  .phone .pbar .sub{color:rgba(255,255,255,0.8); font-size:10.5px; margin-top:2px;}
  .phone .pbody{padding:12px 14px; display:flex; flex-direction:column; gap:9px;}
  .mcard{background:var(--panel-2); border:1px solid var(--line-strong); border-radius:11px; padding:11px;}
  .mcard .r1{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:700;}
  .mcard .r2{font-size:10px; color:var(--text-dim); margin-top:5px;}
  .mchip{display:inline-block; font-size:9px; font-weight:700; background:var(--panel); border:1px solid var(--line-strong); color:var(--text-dim); padding:2px 7px; border-radius:100px; margin-right:5px; margin-top:6px;}
  .mbadge{font-size:9px; font-weight:700; padding:3px 8px; border-radius:100px;}
  .mbadge.green{background:rgba(16,185,129,0.22); color:#34D399;}
  .mbadge.amber{background:rgba(245,158,11,0.22); color:var(--amber);}
  .mbadge.red{background:rgba(153,0,0,0.22); color:#F87171;}
  .mprog{height:5px; border-radius:5px; background:var(--panel); overflow:hidden; margin-top:8px;}
  .mprog i{display:block; height:100%; background:var(--red-bright); border-radius:5px;}
  .mdoc{display:flex; align-items:center; gap:9px; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; font-size:10.5px; font-weight:600;}
  .mdoc .ic{width:22px;height:22px;border-radius:6px; background:var(--panel); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px;}
  .mdoc .ic.ok{background:rgba(16,185,129,0.22); color:#34D399;}
  .msig{background:#fff; border-radius:8px; height:56px; margin-top:8px; position:relative; overflow:hidden;}
  .msig svg{position:absolute; inset:0; width:100%; height:100%;}
  .mtab{display:flex; gap:0; border-top:1px solid var(--line); margin-top:auto; padding-top:8px;}
  .mtab span{flex:1; text-align:center; font-size:8px; font-weight:700; color:var(--text-dimmer);}
  .mtab span.on{color:#fff;}
  .mchat{align-self:flex-start; max-width:80%; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px 10px 10px 3px; padding:7px 10px; font-size:10.5px;}
  .mchat.me{align-self:flex-end; background:var(--red-bright); color:#fff; border-radius:10px 10px 3px 10px;}

  /* comparison table scene */
  .cmp-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .cmp-table th, .cmp-table td{padding:11px 12px; text-align:center; border-bottom:1px solid var(--line);}
  .cmp-table th{font-family:'Outfit'; font-size:15px; font-weight:700; color:#fff;}
  .cmp-table td:first-child, .cmp-table th:first-child{text-align:left; color:var(--text-dim); font-weight:600;}
  .cmp-table th.hcga{color:var(--red-text);}
  .yes{color:#34D399; font-size:16px;}
  .no{color:var(--text-dimmer); font-size:16px;}

  /* controls */
  .controls{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:16px; z-index:40;}
  .ctrl-btn{width:42px; height:42px; border-radius:50%; background:var(--panel); border:1px solid var(--line-strong); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .ctrl-btn:active{transform:scale(0.94);}
  .dots{display:flex; gap:6px;}
  .dots span{width:20px; height:3px; border-radius:3px; background:var(--line-strong); cursor:pointer;}
  .dots span.on{background:var(--red-bright);}
  .brandfoot{position:fixed; top:22px; left:28px; display:flex; align-items:center; gap:8px; font-family:'Outfit'; font-weight:700; font-size:15px; color:#fff; z-index:40; opacity:0.85;}
  .brandfoot small{font-family:'Inter'; font-weight:600; font-size:9px; color:var(--text-dim); display:block; letter-spacing:1px;}
  .counter{position:fixed; top:26px; right:28px; font-size:12px; color:var(--text-dim); font-weight:600; z-index:40;}
  @media (max-width:820px){
    .scene .scene-inner{flex-direction:column-reverse; text-align:center; gap:26px;}
    .col-text .body-text, .col-text .pill-row{margin-left:auto; margin-right:auto;}
    .phone{width:210px; height:440px; transform:scale(0.95);}
  }

      <div class="mdoc"><div class="ic">↑</div><div style="flex:1;">BOL · Bill of Lading<div style="color:var(--text-dim); font-weight:500;">Pendiente de firma</div></div></div>
      <div class="msig"><svg viewBox="0 0 200 60"><path d="M10 45 C 30 20, 45 55, 60 30 S 90 10, 105 40 S 140 20, 160 35" fill="none" stroke="#111111" stroke-width="2.5"/></svg></div>
      <div class="mcard" style="text-align:center; background:var(--red-bright); border:none;"><b style="color:#fff; font-size:11.5px;">Confirmar firma</b></div>
    </div>`;

  const SCENES = [
    { kind:'stack', kicker:'HCGA TRADING LLC', headline:'Todo tu negocio de transporte,<br><em>en una sola plataforma.</em>', body:'Una app para choferes y flotillas. Un portal para shippers y brokers. Sin llamadas, sin papeles, sin cinco apps distintas.', pills:['App de choferes','Client Portal','Panel de flotilla'] },
    { kind:'split', kicker:'EL PROBLEMA', headline:'Hoy, un chofer usa <em>5 apps distintas</em> para hacer su trabajo.', body:'Una para encontrar cargas, otra para el GPS, otra para truck stops, otra para mensajes con el broker, y papeleo físico para el DVIR y el BOL.', pills:['Tablero de cargas', 'Trucker Path', 'GPS comercial', 'WhatsApp', 'Papel'], pillClass:'bad', visual:'none' },
    { kind:'split', kicker:'LA SOLUCIÓN', headline:'HCGA reúne <em>todo el flujo</em> en una sola app.', body:'Desde crear el perfil hasta cobrar la carga — cargas, inspección, navegación, chat y pagos, todo conectado.', visual:phoneDriverLoad },
    { kind:'split', kicker:'ONBOARDING', headline:'Verificación de identidad <em>desde el celular</em>, en minutos.', body:'Licencia, comprobante de domicilio, permiso de trabajo y reconocimiento facial — todo capturado con la cámara del teléfono, sin ir a una oficina.', visual:phoneDocs, pills:['Owner Operator','Compañía con flotilla'] },
    { kind:'split', kicker:'CUMPLIMIENTO', headline:'Inspección del vehículo <em>100% digital</em>.', body:'El DVIR se completa desde la app antes de cada viaje, con historial guardado — nada de checklists en papel que se pierden.', visual:phoneDvir },
    { kind:'split', kicker:'NAVEGACIÓN', headline:'GPS comercial con <em>truck stops en tiempo real</em>.', body:'Precios de diésel, básculas CAT, parqueo disponible y áreas de descanso en la ruta — como Trucker Path, integrado en la misma app de trabajo.', visual:phoneGps },
    { kind:'split', kicker:'COMUNICACIÓN', headline:'Chat directo con brokers y shippers.', body:'Sin cambiar de app ni depender de llamadas perdidas — la conversación de cada carga queda dentro de su propio hilo.', visual:phoneChat },
    { kind:'split', kicker:'CLIENT PORTAL', headline:'Tus clientes ven <em>la carga en vivo</em>, sin llamarte.', body:'Shippers y brokers siguen el estado exacto del envío — reservado, inspección, en tránsito, entregado — con el chofer asignado y su ETA.', visual:phoneClientTrack },
    { kind:'split', kicker:'DOCUMENTACIÓN', headline:'Rate Confirmation y BOL, <em>firmados digitalmente</em>.', body:'El cliente sube los documentos y los firma con el dedo desde la app — control total de la carga y su papeleo, en tiempo real.', visual:phoneClientDocs },
    { kind:'compare', kicker:'LA VENTAJA', headline:'Lo que ninguna otra plataforma ofrece <em>junto</em>.' },
  ];

  const stage = document.getElementById('stage');
  const dotsWrap = document.getElementById('dots');
  const counter = document.getElementById('counter');

  function phoneMock(html){
    return `<div class="phone"><div class="pbody" style="height:100%; display:flex; flex-direction:column; padding:0;">${html}</div></div>`;
  }

  function compareTable(){
    const rows = [
      ['Tablero de cargas + aceptación', true, true, false, true],
      ['DVIR digital con historial', true, false, false, false],
      ['Verificación de identidad + selfie en el registro', true, false, false, false],
      ['GPS con truck stops, básculas y combustible', false, true, false, false],
      ['Chat directo chofer ↔ broker/shipper', true, false, false, true],
      ['Tracking en vivo para el cliente', true, false, false, true],
      ['Rate Confirmation y BOL con firma digital', true, false, false, false],
      ['Panel de flotilla multi-camión', true, false, true, false],
    ];
    return `<div style="width:100%; max-width:820px; margin:0 auto;">
      <table class="cmp-table">
        <tr><th>Funcionalidad</th><th class="hcga">HCGA</th><th>Trucker Path</th><th>Amazon Relay</th><th>TMS típico</th></tr>
        ${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td>${v? '<span class="yes">✓</span>':'<span class="no">–</span>'}</td>`).join('')}</tr>`).join('')}
      </table>
    </div>`;
  }

  function sceneHtml(s, i){
    if(s.kind === 'compare'){
      return `<div class="scene-inner" style="flex-direction:column; max-width:900px;">
        <div class="kicker" style="justify-content:center;"><span class="dot"></span>${s.kicker}</div>
        <h1 class="headline" style="text-align:center; margin-bottom:28px;">${s.headline}</h1>
        ${compareTable()}
      </div>`;
    }
    const textBlock = `
      <div class="col-text">
        <div class="kicker"><span class="dot"></span>${s.kicker}</div>
        <h1 class="headline">${s.headline}</h1>
        <p class="body-text">${s.body}</p>
        ${s.pills? `<div class="pill-row">${s.pills.map(p=>`<span class="pill ${s.pillClass||''}">${p}</span>`).join('')}</div>` : ''}
      </div>`;
    if(s.kind==='stack'){
      return `<div class="scene-inner">${textBlock}</div>`;
    }
    const visual = s.visual && s.visual!=='none' ? `<div class="col-visual">${phoneMock(s.visual)}</div>` : '';
    return `<div class="scene-inner">${textBlock}${visual}</div>`;
  }

  SCENES.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'scene' + (s.kind==='stack' || s.kind==='compare' ? ' stack':'');
    el.id = 'scene-'+i;
    el.innerHTML = sceneHtml(s,i);
    stage.appendChild(el);
    const dot = document.createElement('span');
    dot.dataset.i = i;
    dotsWrap.appendChild(dot);
  });

  let current = 0, playing = true, timer = null;
  const DURATION = 5200;

  function goTo(i){
    current = (i + SCENES.length) % SCENES.length;
    document.querySelectorAll('.scene').forEach((el,idx)=> el.classList.toggle('active', idx===current));
    document.querySelectorAll('#dots span').forEach((el,idx)=> el.classList.toggle('on', idx===current));
    counter.textContent = (current+1) + ' / ' + SCENES.length;
    resetTimer();
  }
  function resetTimer(){
    clearInterval(timer);
    if(playing) timer = setInterval(()=> goTo(current+1), DURATION);
  }
  document.querySelectorAll('#dots span').forEach(el=> el.addEventListener('click', ()=> goTo(Number(el.dataset.i))));
  document.getElementById('btn-next').addEventListener('click', ()=> goTo(current+1));
  document.getElementById('btn-prev').addEventListener('click', ()=> goTo(current-1));
  document.getElementById('btn-play').addEventListener('click', function(){
    playing = !playing;
    this.textContent = playing ? '❚❚' : '▶';
    resetTimer();
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight') goTo(current+1);
    if(e.key==='ArrowLeft') goTo(current-1);
    if(e.key===' '){ e.preventDefault(); document.getElementById('btn-play').click(); }
  });

  goTo(0);
})();
</script>
<script src="hcga-theme-lang.js"></script>
</body>
</html>
